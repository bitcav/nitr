name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Vet & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ''
          # Pinned to windows-2025, not windows-latest. Verified 2026-07-27
          # against actions/runner-images: windows-latest currently aliases
          # windows-2025 (Windows Server 2025, x64, GA). It is not about to
          # migrate (no newer Windows Server image is in beta), but this
          # project makes explicit platform claims in its README, so the
          # tested image is pinned to keep that claim verifiable and to stop
          # the label silently drifting under us. Re-point when a newer
          # Windows Server runner image becomes generally available.
          - os: windows-2025
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    # The two Windows bugs this project hit were hangs, not failures; without
    # a timeout a hang burns the 6-hour job default instead of failing fast.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Download dependencies
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      # Artifact smoke test: building is not testing. This builds the real
      # binary and executes it on each OS, asserting exit 0 AND a sane version
      # string. It is the guard against the init()-panic class of bug, where
      # every built binary died before main() while go test stayed green.
      # shell: bash is explicit because the Windows default is PowerShell and
      # grep / the pipe idiom are bash; Git Bash ships on windows-* runners.
      - name: Smoke test built binary
        shell: bash
        run: |
          go build -o nitr${{ matrix.ext }} .
          ./nitr${{ matrix.ext }} version | grep "Nitr v"

  build:
    name: Cross-compile binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o nitr_linux_amd64
      - name: Build Linux 386
        env:
          GOOS: linux
          GOARCH: '386'
        run: go build -o nitr_linux_386
      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
      - name: Generate Windows resource (icon)
        run: goversioninfo -platform-specific -icon=./images/app.ico
      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o nitr_windows_amd64.exe
      - name: Build Windows 386
        env:
          GOOS: windows
          GOARCH: '386'
        run: go build -o nitr_windows_386.exe
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nitr-binaries
          path: |
            nitr_linux_amd64
            nitr_linux_386
            nitr_windows_amd64.exe
            nitr_windows_386.exe

  release:
    name: Draft Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nitr-binaries
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: nitr ${{ github.ref_name }}
          files: |
            nitr_linux_amd64
            nitr_linux_386
            nitr_windows_amd64.exe
            nitr_windows_386.exe
