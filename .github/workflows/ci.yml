name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  test:
    name: Vet & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ''
          # Pinned to windows-2025, not windows-latest. Verified 2026-07-27
          # against actions/runner-images: windows-latest currently aliases
          # windows-2025 (Windows Server 2025, x64, GA). It is not about to
          # migrate (no newer Windows Server image is in beta), but this
          # project makes explicit platform claims in its README, so the
          # tested image is pinned to keep that claim verifiable and to stop
          # the label silently drifting under us. Re-point when a newer
          # Windows Server runner image becomes generally available.
          - os: windows-2025
            ext: '.exe'
    runs-on: ${{ matrix.os }}
    # POSIX shell for every step on every OS: on Windows runners the default
    # is PowerShell, where `test`, `$(...)` and pipes are not what executes.
    # Plain `go` commands happened to work there by luck, not design — Git
    # Bash ships on the windows runners and the smoke-test step already
    # proves it works.
    defaults:
      run:
        shell: bash
    # The two Windows bugs this project hit were hangs, not failures; without
    # a timeout a hang burns the 6-hour job default instead of failing fast.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Download dependencies
        run: go mod download
      # Formatting guard: the repo has drifted out of gofmt-clean twice
      # already. rice-box.go is generated and excluded by name; the pattern is
      # a no-op once that file is deleted (see 1vjum1mojzvq).
      # Linux-only: gofmt is OS-invariant for identical bytes, so running it
      # on Windows buys nothing and adds a CRLF-checkout failure mode
      # (.gitattributes normalises the bytes; this skips the triplicated work).
      - name: Check formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l . | grep -v 'rice-box\.go$')"
      - name: Vet
        run: go vet ./...
      # -race is load-bearing, not optional: a metrics-writer goroutine once
      # outlived its websocket handler and wrote into a pooled, reused conn
      # (use-after-free). Only the race detector sees that class of bug.
      - name: Test
        run: go test -race ./...
      # Artifact smoke test: building is not testing. This builds the real
      # binary and executes it on each OS, asserting exit 0 AND a sane version
      # string. It is the guard against the init()-panic class of bug, where
      # every built binary died before main() while go test stayed green.
      # shell: bash is explicit because the Windows default is PowerShell and
      # grep / the pipe idiom are bash; Git Bash ships on windows-* runners.
      - name: Smoke test built binary
        shell: bash
        run: |
          go build -o nitr${{ matrix.ext }} .
          ./nitr${{ matrix.ext }} version | grep "Nitr v"

  build:
    name: Cross-compile binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -o nitr_linux_amd64
      - name: Build Linux 386
        env:
          GOOS: linux
          GOARCH: '386'
        run: go build -o nitr_linux_386
      # linux/arm64 is a shipped target (Raspberry Pi / ARM SBC / ARM VPS
      # audience): the arm64-probe job below executes this exact binary on a
      # real ARM64 runner and smoke-gates it, and it is included in the Draft
      # Release `files:` list. SMBIOS-dependent endpoints (/bios, /chassis,
      # /baseboard, /product, /memory) are expected to be thin on SBCs, which
      # have no SMBIOS — documented in the README, not a ship blocker.
      - name: Build Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -o nitr_linux_arm64
      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest
      - name: Generate Windows resource (icon)
        run: goversioninfo -platform-specific -icon=./images/app.ico
      - name: Build Windows amd64
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o nitr_windows_amd64.exe
      - name: Build Windows 386
        env:
          GOOS: windows
          GOARCH: '386'
        run: go build -o nitr_windows_386.exe
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nitr-binaries
          path: |
            nitr_linux_amd64
            nitr_linux_386
            nitr_linux_arm64
            nitr_windows_amd64.exe
            nitr_windows_386.exe

  # Evidence-gathering job for the linux/arm64 target under evaluation, NOT a
  # release gate (deliberately absent from the release job's `needs`): runs
  # the arm64
  # binary on a real ARM64 runner and records per-endpoint behaviour. A red
  # cell in its report table is a finding, not a CI failure — the job fails
  # only if the binary won't run, the server won't start, or the API key
  # can't be obtained. Runner label verified 2026-07-29 against
  # actions/runner-images: ubuntu-24.04-arm is GA (not preview) and free for
  # public repos. NOTE: it is a cloud VM, not an SBC — it may expose DMI
  # where a Raspberry Pi does not, so its table does not generalise 1:1 to
  # all ARM Linux hardware.
  arm64-probe:
    name: Linux arm64 endpoint probe (evidence-only)
    needs: [build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nitr-binaries
      # NOT redundant: actions/upload-artifact zips files for transport and
      # drops POSIX modes, so the downloaded binary arrives as 0644 and
      # executing it fails with Permission denied (first arm64 probe run,
      # 2026-07-29). Windows never hit this — .exe has no exec bit.
      - name: Restore executable bit
        shell: bash
        run: chmod +x ./nitr_linux_arm64
      - name: Probe all API endpoints on Linux arm64
        shell: bash
        run: ./scripts/linux_arm64_endpoint_probe.sh ./nitr_linux_arm64 linux-arm64-endpoint-report.md
      - name: Upload probe report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nitr-linux-arm64-endpoint-report
          path: linux-arm64-endpoint-report.md
          if-no-files-found: warn

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Workflow-shell guard: a `run:` step with no explicit `shell:` in a
      # Windows-capable job executes under PowerShell by default — the
      # windows-2025 gofmt break, 2026-07-28. actionlint does NOT catch this
      # (it cannot infer the shell through `runs-on: ${{ matrix.os }}`, so it
      # skips shellcheck), so scripts/check_workflow_shell.py enforces it.
      # pyyaml is installed explicitly: the check must hard-fail, never
      # silently pass, when its dependency is missing. The self-test runs
      # first — a guard that has never failed is not known to work.
      - name: Workflow shell check
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/test_check_workflow_shell.py
          python3 scripts/check_workflow_shell.py
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
      # Standardised on golangci-lint: staticcheck-standalone cannot analyse
      # this module (built with go1.25, module requires go1.26), while
      # golangci-lint runs today and bundles staticcheck's checks.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.2

  release:
    name: Draft Release
    needs: [test, build, lint]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: nitr-binaries
      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: nitr ${{ github.ref_name }}
          # (Any comment must live OUTSIDE the `files: |` block: that is a
          # literal scalar and `#` lines inside it are handed to
          # action-gh-release as glob patterns, not comments.)
          files: |
            nitr_linux_amd64
            nitr_linux_386
            nitr_linux_arm64
            nitr_windows_amd64.exe
            nitr_windows_386.exe
